<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FunPack</title>
  <script src="/funpack/app/shell/theme.js"></script>
  <link rel="stylesheet" href="/funpack/app/composer/composer.css">
  <style>
    /* The app frame itself: the only rule outside the kit, and it sets no
       colours, sizes or type -- just the shape of the page. A DEFINITE height,
       because the kit's frame fills what it is given and "100% of auto" is
       auto: with min-height here the whole app rendered as a strip at the top
       of an empty window. */
    html, body { block-size: 100%; }
    body { display: flex; margin: 0; }
    /* No padding: the frame's own bands run edge to edge, and the space
       around the content is the gutter the kit applies inside them. */
    #app { flex: 1; display: flex; min-block-size: 0; }
    #app > * { flex: 1; min-inline-size: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/funpack/app/boot.js"></script>
</body>
</html>
