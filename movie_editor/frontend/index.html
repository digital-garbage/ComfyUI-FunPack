<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FunPack · Cutting Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ───────────────────────── MENU BAR ───────────────────────── -->
  <nav class="menubar" id="menubar">
    <div class="brand"><span class="brand-mark">◉</span> FunPack <span class="brand-sub">Cutting Room</span></div>
    <div class="menus" id="menus"><!-- populated by menubar.js --></div>
    <div class="menubar-right">
      <span class="save-chip" id="save-chip"></span>
      <span class="health-chip" id="health-chip"></span>
    </div>
  </nav>

  <!-- ───────────────────────── WORKSPACE ───────────────────────── -->
  <div class="workspace" id="workspace">
    <div class="row-main">
      <!-- LEFT: media browser -->
      <aside class="zone media" id="media-zone">
        <div class="zone-head"><span class="zone-title">Media Browser</span></div>
        <div class="zone-body" id="media-body"></div>
      </aside>

      <div class="splitter splitter-v" id="split-left" title="Drag to resize"></div>

      <!-- RIGHT: preview + inspector -->
      <section class="right-stack">
        <div class="zone preview" id="preview-zone">
          <div class="zone-head">
            <span class="zone-title">Preview</span>
            <span class="zone-head-right" id="preview-status"></span>
          </div>
          <div class="zone-body program" id="preview-body"></div>
        </div>
        <div class="zone inspector" id="inspector-zone">
          <div class="zone-head"><span class="zone-title" id="inspector-title">Inspector</span></div>
          <div class="zone-body" id="inspector-body"></div>
        </div>
      </section>
    </div>

    <div class="splitter splitter-h" id="split-bottom" title="Drag to resize"></div>

    <!-- BOTTOM: timeline -->
    <section class="zone timeline" id="timeline-zone">
      <div class="zone-head">
        <span class="zone-title">Timeline</span>
        <span class="zone-head-right" id="timeline-meta"></span>
      </div>
      <div class="zone-body" id="timeline-body"></div>
    </section>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="menu-veil" id="menu-veil" hidden></div>

  <script src="api.js"></script>
  <script src="dom.js"></script>
  <script src="store.js"></script>
  <script src="models.js"></script>
  <script src="menubar.js"></script>
  <script src="mediabrowser.js"></script>
  <script src="player.js"></script>
  <script src="inspector.js"></script>
  <script src="timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
