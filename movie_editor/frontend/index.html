<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FunPack · Cutting Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Boot-time error surface: if any script fails, show it instead of a blank app.
    (function () {
      function show(msg) {
        var b = document.getElementById("boot-error");
        if (!b) {
          b = document.createElement("div"); b.id = "boot-error";
          b.style.cssText = "position:fixed;z-index:99999;left:0;right:0;top:0;padding:10px 34px 10px 14px;" +
            "background:#3a1320;color:#ffb3c1;font:12px/1.5 monospace;border-bottom:1px solid #e0566b;white-space:pre-wrap";
          var x = document.createElement("button");
          x.textContent = "✕"; x.title = "Dismiss";
          x.style.cssText = "position:absolute;top:6px;right:8px;background:transparent;border:1px solid #e0566b;" +
            "color:#ffb3c1;border-radius:6px;cursor:pointer;font:12px monospace;padding:1px 7px;line-height:1.4";
          x.onclick = function () { b.remove(); };
          b.appendChild(x);
          (document.body || document.documentElement).appendChild(b);
        }
        var t = b.querySelector(".boot-error-text");
        if (!t) { t = document.createElement("span"); t.className = "boot-error-text"; b.insertBefore(t, b.firstChild); }
        t.textContent = "Movie Editor error — " + msg + "\n(restart ComfyUI + hard-reload Cmd/Ctrl+Shift+R; if it persists, send me this text)";
      }
      window.addEventListener("error", function (e) {
        show((e.message || "load error") + (e.filename ? "  @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("promise: " + ((e.reason && (e.reason.message || e.reason)) || "rejected"));
      });
    })();
  </script>
</head>
<body>
  <!-- ───────────────────────── MENU BAR ───────────────────────── -->
  <nav class="menubar" id="menubar">
    <div class="brand"><span class="brand-mark">◉</span> FunPack <span class="brand-sub">Cutting Room</span></div>
    <div class="menus" id="menus"><!-- populated by menubar.js --></div>
    <div class="menubar-right">
      <span class="save-chip" id="save-chip"></span>
      <span class="health-chip" id="health-chip"></span>
    </div>
  </nav>

  <!-- ───────────────────────── WORKSPACE ───────────────────────── -->
  <div class="workspace" id="workspace">
    <div class="row-main">
      <!-- LEFT: media browser -->
      <aside class="zone media" id="media-zone">
        <div class="zone-head"><span class="zone-title">Media Browser</span></div>
        <div class="zone-body" id="media-body"></div>
      </aside>

      <div class="splitter splitter-v" id="split-left" title="Drag to resize"></div>

      <!-- RIGHT: preview + inspector -->
      <section class="right-stack">
        <div class="zone preview" id="preview-zone">
          <div class="zone-head">
            <span class="zone-title">Preview</span>
            <span class="zone-head-right" id="preview-status"></span>
          </div>
          <div class="zone-body program" id="preview-body"></div>
        </div>
        <div class="zone inspector" id="inspector-zone">
          <div class="zone-head"><span class="zone-title" id="inspector-title">Inspector</span></div>
          <div class="zone-body" id="inspector-body"></div>
        </div>
      </section>
    </div>

    <div class="splitter splitter-h" id="split-bottom" title="Drag to resize"></div>

    <!-- BOTTOM: timeline -->
    <section class="zone timeline" id="timeline-zone">
      <div class="zone-head">
        <span class="zone-title">Timeline</span>
        <span class="zone-head-right" id="timeline-meta"></span>
      </div>
      <div class="zone-body" id="timeline-body"></div>
    </section>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="menu-veil" id="menu-veil" hidden></div>

  <script src="api.js"></script>
  <script src="dom.js"></script>
  <script src="store.js"></script>
  <script src="models.js"></script>
  <script src="menubar.js"></script>
  <script src="mediabrowser.js"></script>
  <script src="log.js"></script>
  <script src="player.js"></script>
  <script src="sampler_panel.js"></script>
  <script src="inspector.js"></script>
  <script src="timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
